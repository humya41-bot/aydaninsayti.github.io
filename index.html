<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aviator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="14" fill="#e11d2e"/>
          <path d="M6 16 L18 11 L24 13 L19 15.5 L17 20 L13 16.5 L9 17.5 L7 20 L6 16Z" fill="#fff"/>
        </svg>
        <span class="brand-name">Aviator</span>
      </div>
      <div class="balance-box">
        <a class="nav-link" href="forecast" target="_blank" rel="noopener" title="Flight forecast">
          <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true">
            <path fill="currentColor" d="M10 2.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15Zm0 2a5.5 5.5 0 0 1 4.9 3H10V4.5Zm0 5h5.4A5.5 5.5 0 0 1 10 15.5V9.5Z"/>
          </svg>
          <span class="nav-text">Flight forecast</span>
          <span class="nav-text-sm">Forecast</span>
        </a>
        <span class="balance-value" id="balance">1,000.00 AZN</span>
        <button type="button" class="menu-btn" aria-label="Menu">☰</button>
      </div>
    </header>

    <div class="history" id="history" aria-label="Recent rounds"></div>

    <aside class="live">
      <div class="live-tabs">
        <button type="button" class="live-tab active" data-tab="all">All bets</button>
        <button type="button" class="live-tab" data-tab="prev">Previous</button>
        <button type="button" class="live-tab" data-tab="top">Top</button>
      </div>
      <div class="live-summary">
        <div class="live-count"><span id="betCount">0/100</span> Bets</div>
        <div class="live-bar"><span id="betBar"></span></div>
        <div class="live-total"><span id="winTotal">0.00</span> Total win AZN</div>
      </div>
      <div class="live-head-row">
        <span>Player</span>
        <span>Bet</span>
        <span>X</span>
        <span>Win</span>
      </div>
      <ul class="live-list" id="liveList"></ul>
      <div class="live-foot">
        <span>✓ Provably Fair Game</span>
        <span class="powered">Powered by AVIATOR</span>
      </div>
    </aside>

    <main class="stage">
          <div class="stage-bg"></div>
      <div class="sunburst" aria-hidden="true"></div>
      <canvas id="curve" width="1200" height="700" aria-hidden="true"></canvas>

      <div class="fly-layer" id="flyLayer">
        <div class="plane" id="plane" aria-hidden="true">
          <div class="plane-exhaust">
            <span class="ex-spark s1"></span>
            <span class="ex-spark s2"></span>
            <span class="ex-spark s3"></span>
          </div>
          <svg class="plane-svg" viewBox="0 0 120 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bodyGrad" x1="12" y1="10" x2="110" y2="42" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff6b5a"/>
                <stop offset="0.45" stop-color="#e6392a"/>
                <stop offset="1" stop-color="#a81812"/>
              </linearGradient>
              <linearGradient id="wingGrad" x1="40" y1="8" x2="78" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff8576"/>
                <stop offset="1" stop-color="#c81f18"/>
              </linearGradient>
              <linearGradient id="bellyGrad" x1="30" y1="28" x2="95" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f0f2f5"/>
                <stop offset="1" stop-color="#b8c0cc"/>
              </linearGradient>
            </defs>
            <path d="M14 18 L28 26 L26 30 L10 28 Z" fill="url(#wingGrad)"/>
            <path d="M12 28 L28 30 L22 36 L8 34 Z" fill="#c41f18"/>
            <path d="M26 28 C40 24 70 22 98 26 C102 28 102 32 98 34 C70 38 40 38 26 34 C22 32 22 30 26 28Z" fill="url(#bellyGrad)"/>
            <path d="M22 24 C36 16 72 14 100 22 C106 24 108 28 104 31 C76 38 40 38 24 32 C18 30 18 26 22 24Z" fill="url(#bodyGrad)"/>
            <path d="M72 20 C80 18 88 19 94 22 C90 26 82 27 74 25 C70 24 70 21 72 20Z" fill="#7ed8ff"/>
            <path d="M42 16 C55 8 72 8 86 14 L82 22 C70 18 56 18 46 22 Z" fill="url(#wingGrad)"/>
            <path d="M40 32 C54 36 72 36 88 32 L84 40 C70 44 52 44 38 38 Z" fill="url(#wingGrad)"/>
            <path d="M54 20 L50 34 M70 18 L68 36" stroke="#5a1010" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
            <path d="M98 24 C106 25 112 27 114 29 C112 32 106 33 98 32 C100 28 100 26 98 24Z" fill="#ff4d3d"/>
            <circle cx="112" cy="29" r="3.2" fill="#e8ecf2"/>
            <circle cx="112" cy="29" r="1.3" fill="#3a3f4a"/>
            <ellipse class="prop-blur" cx="114.5" cy="29" rx="2.2" ry="12" fill="#cfd6e0" opacity="0.35"/>
            <path d="M34 24 C50 18 78 17 96 23" stroke="#fff" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="multiplier-wrap" id="multiplierWrap">
        <div class="status-pill" id="statusPill"></div>
        <div class="multiplier" id="multiplier">1.00<span>x</span></div>
        <div class="load-wrap" id="loadWrap">
          <div class="load-bar" id="loadBar"></div>
          <span class="load-sec" id="countdown"></span>
        </div>
      </div>

      <div class="online-pill" id="onlinePill">
        <span class="dots"><i></i><i></i><i></i></span>
        <span id="onlineCount">0</span>
      </div>

      <div class="crash-flash" id="crashFlash"></div>
    </main>

    <section class="bets">
      <div class="bet-panel" data-panel="0">
        <div class="amount-block">
          <button type="button" class="step" data-act="minus">−</button>
          <input type="number" class="bet-amount" value="1" min="1" step="1" />
          <button type="button" class="step" data-act="plus">+</button>
        </div>
        <div class="quick">
          <button type="button" data-amt="1">1</button>
          <button type="button" data-amt="2">2</button>
          <button type="button" data-amt="5">5</button>
          <button type="button" data-amt="10">10</button>
        </div>
        <button type="button" class="action-btn bet" data-action>
          <span class="btn-title">Bet</span>
          <span class="btn-sub" data-sub>1.00 AZN</span>
        </button>
        <input type="hidden" class="auto-cashout" value="0" />
      </div>

      <div class="bet-panel" data-panel="1">
        <div class="amount-block">
          <button type="button" class="step" data-act="minus">−</button>
          <input type="number" class="bet-amount" value="1" min="1" step="1" />
          <button type="button" class="step" data-act="plus">+</button>
        </div>
        <div class="quick">
          <button type="button" data-amt="1">1</button>
          <button type="button" data-amt="2">2</button>
          <button type="button" data-amt="5">5</button>
          <button type="button" data-amt="10">10</button>
        </div>
        <button type="button" class="action-btn bet" data-action>
          <span class="btn-title">Bet</span>
          <span class="btn-sub" data-sub>1.00 AZN</span>
        </button>
        <input type="hidden" class="auto-cashout" value="0" />
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="js/game.js"></script>
</body>
</html>
